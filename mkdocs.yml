site_name: CakeLTE 3.x Documentation
site_description: AdminLTE 4 plugin for CakePHP 5.x
site_url: https://arodu.github.io/cakelte/
repo_url: https://github.com/arodu/cakelte
repo_name: arodu/cakelte
edit_uri: edit/3.next-cake5/docs/
copyright: Copyright &copy; 2026 Alberto Rodriguez — MIT License

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Layouts: layouts.md
  - Header: header.md
  - Sidebar: sidebar.md
  - Pages: pages.md
  - Commands: commands.md
  - Customization: customization.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

strict: true
